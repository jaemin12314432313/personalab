name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: personalab
          POSTGRES_PASSWORD: password
          POSTGRES_DB: personalab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U personalab"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://personalab:password@localhost:5432/personalab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrate (upgrade → downgrade → upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Model ↔ migration drift
        run: alembic check

      - name: Test
        run: pytest -q
