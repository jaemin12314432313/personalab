<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>정보 입력</title></head><body>
<h1>회원 정보를 입력해 주세요</h1>
<form action="S04.html">
<label for="name">이름 *</label><input id="name" required>
<label for="email">학교 이메일 *</label><input id="email" type="email" placeholder="example@univ.ac.kr" required>
<label for="pw">비밀번호 *</label><input id="pw" type="password" required>
<label for="pw2">비밀번호 확인 *</label><input id="pw2" type="password" required>
<label for="school">학교</label><input id="school">
<label for="sid">학번</label><input id="sid">
<label for="major">전공</label><input id="major">
<label for="phone">휴대폰 번호 *</label><input id="phone" type="tel" required>
<label for="birth">생년월일</label><input id="birth" type="date">
<label for="addr">주소</label><input id="addr">
<input type="text" name="ref" placeholder="추천인 코드">
<button type="submit">인증하기</button>
</form>
</body></html>
