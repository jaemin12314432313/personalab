<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PersonaLab 워크스페이스 트렌디 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo+Black&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;800&display=swap">
<style>
:root{--sans:'Geist','Noto Sans KR',system-ui,sans-serif;--kr:'Noto Sans KR','Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:#1a1a1d;color:#eee;font-family:var(--kr);line-height:1.5;padding:32px 20px 80px}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
.intro h1{font-size:30px;margin:0 0 8px;letter-spacing:-.03em}
.intro p{margin:0;color:#a8a8ad;max-width:70ch}
.intro nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.intro nav a{color:#ddd;border:1px solid #3a3a40;border-radius:99px;padding:5px 14px;font-size:13px;text-decoration:none}
.intro nav a:hover{border-color:#fff}
.vh{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.vh small{font-family:var(--mono);font-size:12px;color:#ff8a6b;letter-spacing:.04em}
.vh h2{margin:0;font-size:22px;letter-spacing:-.03em}
.vh p{margin:0;color:#a8a8ad;font-size:14px;max-width:80ch}
.fr{border-radius:16px;overflow-x:auto;border:1px solid #333}
.sc{min-width:1040px;position:relative}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 공통 조각 ---------- */
.cur{position:absolute;display:flex;align-items:center;gap:4px;font:600 10px var(--mono);color:#fff;pointer-events:none}
.cur::before{content:"";width:10px;height:10px;background:currentColor;clip-path:polygon(0 0,100% 55%,55% 62%,40% 100%)}
.cur span{padding:1px 6px;border-radius:99px;background:currentColor}
.cur span b{color:#fff;font-weight:600}
.shot{position:relative;overflow:hidden;background:var(--sb,#e9e7e2);display:flex;flex-direction:column;gap:7px;padding:12px}
.shot i{display:block;height:7px;border-radius:3px;background:rgba(0,0,0,.14)}
.shot em{display:block;flex:1;border-radius:7px;background:rgba(0,0,0,.07)}
.shot u{display:block;height:15px;width:36%;border-radius:99px;background:rgba(0,0,0,.72)}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-8px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-12px,10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.dr1{animation:drift 5s ease-in-out infinite}.dr2{animation:drift2 6s ease-in-out infinite}

/* ================= V1 COMMAND (dark, linear-like) ================= */
.v1{background:#09090b;color:#e6e6ea;font-family:var(--sans);font-size:14px;min-height:640px;display:flex;flex-direction:column}
.v1 .bar{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.v1 .lg{font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.v1 .lg::before{content:"";width:18px;height:18px;border-radius:6px;background:conic-gradient(from 200deg,#4f7cff,#2fd3c4,#4f7cff)}
.v1 .k{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.1);border-radius:9px;color:#8b8b95;background:rgba(255,255,255,.03)}
.v1 kbd{font:500 11px var(--mono);border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:1px 6px;color:#9a9aa5}
.v1 .main{display:grid;grid-template-columns:1fr 360px;flex:1}
.v1 .list{padding:16px 12px;border-right:1px solid rgba(255,255,255,.07)}
.v1 .tabs{display:flex;gap:4px;padding:0 8px 12px;font-size:13px;color:#8b8b95}
.v1 .tabs b{font-weight:500;padding:4px 10px;border-radius:7px}
.v1 .tabs b.on{background:rgba(255,255,255,.08);color:#fff}
.v1 .grp{font:500 11px var(--mono);letter-spacing:.06em;color:#6c6c77;padding:14px 12px 6px}
.v1 .r{display:grid;grid-template-columns:22px 1fr 150px 90px 110px;gap:12px;align-items:center;padding:9px 12px;border-radius:9px}
.v1 .r:hover,.v1 .r.sel{background:rgba(255,255,255,.055)}
.v1 .r .n{font-weight:500;color:#f2f2f5}
.v1 .r .s{color:#8b8b95;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v1 .go{justify-self:end;font-size:12px;font-weight:500;padding:4px 11px;border-radius:7px;border:1px solid rgba(255,255,255,.12);color:#d8d8de}
.v1 .go.p{background:#e6e6ea;color:#09090b;border-color:#e6e6ea}
.v1 .pv{padding:20px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(400px 260px at 70% 0,rgba(79,124,255,.12),transparent)}
.v1 .pv .shot{height:190px;border-radius:12px;border:1px solid rgba(255,255,255,.1);--sb:#d9dce6}
.v1 .pv h3{margin:0;font-size:20px;letter-spacing:-.03em}
.v1 .pv dl{margin:0;display:grid;grid-template-columns:80px 1fr;gap:8px;font-size:13px}
.v1 .pv dt{color:#6c6c77}.v1 .pv dd{margin:0;color:#cfcfd6}
.v1 .big{height:40px;border-radius:10px;background:#e6e6ea;color:#09090b;font-weight:600;display:grid;place-items:center}
.v1 .pal{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:520px;background:#16161a;border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.v1 .pal .q{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);color:#e6e6ea}
.v1 .pal .q span{color:#6c6c77}
.v1 .pal .o{display:flex;justify-content:space-between;padding:9px 16px;font-size:13px;color:#b8b8c0}
.v1 .pal .o.on{background:rgba(255,255,255,.07);color:#fff}

/* ================= V2 BENTO (light, soft) ================= */
.v2{background:#f1f0ec;color:#16140f;font-family:'Bricolage Grotesque','Noto Sans KR',sans-serif;padding:26px;display:flex;flex-direction:column;gap:20px;min-height:700px}
.v2 .hd{display:flex;align-items:center;gap:14px}
.v2 .hd .lg{font-weight:800;font-size:20px;letter-spacing:-.04em}
.v2 .pill{height:38px;padding:0 16px;border-radius:99px;background:#fff;display:inline-flex;align-items:center;gap:8px;font:500 13px var(--kr);color:#6a665c;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.v2 .pill.dk{background:#16140f;color:#fff;font-weight:700}
.v2 .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:14px}
.v2 .t{background:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.v2 .t h3{margin:0;font-weight:800;font-size:19px;letter-spacing:-.03em;line-height:1.2}
.v2 .t .m{font:400 12.5px var(--kr);color:#7a766b}
.v2 .t .b{align-self:flex-start;height:32px;padding:0 14px;border-radius:99px;background:#16140f;color:#fff;font:700 12px var(--kr);display:inline-flex;align-items:center}
.v2 .live{grid-column:span 2;grid-row:span 3;background:linear-gradient(155deg,#ff7a4d,#ff4d6d 55%,#c23a8a);color:#fff}
.v2 .live .m{color:rgba(255,255,255,.8)}
.v2 .live h3{font-size:34px;line-height:1.1}
.v2 .live .b{background:#fff;color:#16140f;height:42px;padding:0 20px;font-size:14px}
.v2 .phone{position:absolute;right:28px;bottom:-40px;width:210px;height:330px;border-radius:30px;background:#16140f;padding:8px;transform:rotate(6deg);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.v2 .phone .shot{height:100%;border-radius:23px;--sb:#f2e9e0}
.v2 .done{grid-column:span 2;grid-row:span 2}
.v2 .bad{background:#ffe9e3}
.v2 .add{border:2px dashed #cfcac0;background:transparent;align-items:center;justify-content:center;color:#8a867b;font:700 14px var(--kr);gap:6px;flex-direction:column}
.v2 .add b{font-size:30px;font-weight:400;line-height:1;color:#16140f}
.v2 .tag{font:700 11px var(--kr);padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.07);align-self:flex-start}
.v2 .live .tag{background:rgba(255,255,255,.25)}
.v2 .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}.v2 .bar i{display:block;height:100%;background:#fff;width:40%}

/* ================= V3 SENTENCE (editorial, text-first) ================= */
.v3{background:#fbfaf7;color:#14130f;font-family:var(--kr);padding:34px 56px 50px;min-height:700px;display:flex;flex-direction:column;gap:40px}
.v3 .hd{display:flex;align-items:center;gap:26px;font-size:14px;color:#8a867b}
.v3 .hd .lg{font:800 19px 'Noto Serif KR',serif;color:#14130f;letter-spacing:-.05em;margin-right:8px}
.v3 .hd .on{color:#14130f;font-weight:700}
.v3 .hd .nb{margin-left:auto;background:#14130f;color:#fff;border-radius:99px;padding:8px 18px;font-weight:700}
.v3 .sent{font:800 40px/1.5 'Noto Serif KR',serif;letter-spacing:-.06em;max-width:900px}
.v3 .sent .p{display:inline-flex;align-items:center;gap:8px;font:700 17px var(--kr);letter-spacing:-.02em;border-radius:99px;padding:3px 16px 3px 12px;vertical-align:middle;transform:translateY(-3px)}
.v3 .p.b{background:#dfe8ff;color:#2347b8}.v3 .p.r{background:#ffe2dc;color:#b3341f}.v3 .p.k{background:#ece9e0;color:#4b483f}
.v3 .p i{width:8px;height:8px;border-radius:50%;background:currentColor}
.v3 .tb{display:flex;gap:14px;align-items:center;border-bottom:2px solid #14130f;padding-bottom:12px;font-size:14px;color:#8a867b}
.v3 .tb b{color:#14130f}.v3 .tb .sp{flex:1}
.v3 .row{display:grid;grid-template-columns:60px 1.2fr 1.6fr 120px 150px;gap:16px;align-items:center;padding:20px 0;border-bottom:1px solid #e4e0d5}
.v3 .row:hover{background:#f3f0e8}
.v3 .row .no{font:500 13px var(--mono);color:#a8a498}
.v3 .row .nm{font:800 22px 'Noto Serif KR',serif;letter-spacing:-.05em}
.v3 .row .in{color:#6a665c;font-size:14px}
.v3 .row .ar{justify-self:end;font-weight:700;display:flex;align-items:center;gap:8px}
.v3 .row .ar::after{content:"→";font-size:20px}

/* ================= V4 NEO-BRUTAL ================= */
.v4{background:#fff4d6;color:#111;font-family:var(--kr);padding:26px;min-height:700px;display:flex;flex-direction:column;gap:22px;background-image:radial-gradient(#111 1px,transparent 1.4px);background-size:22px 22px;background-position:0 0}
.v4 .hd{display:flex;align-items:center;gap:12px}
.v4 .lg{font:400 24px 'Archivo Black','Noto Sans KR',sans-serif;background:#111;color:#fff4d6;padding:2px 12px;transform:rotate(-2deg)}
.v4 .bx{border:3px solid #111;background:#fff;box-shadow:5px 5px 0 #111;font-weight:900;font-size:13px;padding:7px 14px}
.v4 .bx.y{background:#ffd23f}.v4 .bx.p{background:#ff7eb6}
.v4 h2{margin:0;font:400 44px/1.05 'Archivo Black','Noto Sans KR',sans-serif;letter-spacing:-.03em}
.v4 .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.v4 .c{border:3px solid #111;box-shadow:7px 7px 0 #111;background:#fff;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.v4 .c:nth-child(odd){transform:rotate(-.6deg)}.v4 .c:nth-child(even){transform:rotate(.5deg)}
.v4 .c h3{margin:0;font:900 20px var(--kr);letter-spacing:-.04em}
.v4 .c .m{font-size:13px;font-weight:500}
.v4 .st{position:absolute;right:-10px;top:-14px;border:3px solid #111;padding:2px 10px;font-weight:900;font-size:12px;transform:rotate(4deg)}
.v4 .st.run{background:#4de1a1}.v4 .st.ok{background:#8ec5ff}.v4 .st.dr{background:#fff}.v4 .st.bad{background:#ff6b5a}.v4 .st.rd{background:#ffd23f}.v4 .st.pt{background:#ff7eb6}
.v4 .c .shot{height:84px;border:3px solid #111;--sb:#f0f0f0}
.v4 .c .go{border:3px solid #111;background:#111;color:#fff;font-weight:900;font-size:13px;padding:7px;text-align:center}
.v4 .c .go:hover{background:#ffd23f;color:#111}

/* ================= V5 AURORA GLASS (dark, spatial) ================= */
.v5{background:#070b18;color:#eef0ff;font-family:var(--sans);padding:26px 30px;min-height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:22px}
.v5::before,.v5::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
.v5::before{width:520px;height:520px;left:-120px;top:-160px;background:#3b5bff}
.v5::after{width:460px;height:460px;right:-100px;bottom:-140px;background:#ff5fa2;opacity:.4}
.v5>*{position:relative;z-index:1}
.v5 .hd{display:flex;align-items:center;gap:14px}
.v5 .lg{font-weight:700;font-size:17px;letter-spacing:-.03em}
.v5 .glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px}
.v5 .chip{height:36px;padding:0 15px;border-radius:99px;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#c9ccee}
.v5 .chip.w{background:#fff;color:#0b0f24;font-weight:700;border:0}
.v5 h2{margin:0;font-size:34px;letter-spacing:-.04em;line-height:1.2;font-weight:600}
.v5 h2 span{background:linear-gradient(90deg,#8fa5ff,#ff9ccc);-webkit-background-clip:text;background-clip:text;color:transparent}
.v5 .lane{display:flex;flex-direction:column;gap:10px}
.v5 .lane h4{margin:0;font:500 11px var(--mono);letter-spacing:.08em;color:#8d92c4}
.v5 .rowc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.v5 .card{padding:12px;display:flex;flex-direction:column;gap:12px}
.v5 .card .shot{height:150px;border-radius:12px;--sb:#cfd3ea}
.v5 .card.big{grid-column:span 2;flex-direction:row;gap:18px;padding:14px}
.v5 .card.big .shot{flex:1.3;height:auto;min-height:230px}
.v5 .card .tx{display:flex;flex-direction:column;gap:6px;padding:2px 6px 6px;flex:1}
.v5 .card h3{margin:0;font-size:18px;letter-spacing:-.03em;font-weight:600}
.v5 .card .m{color:#9da2d3;font-size:13px}
.v5 .btn{margin-top:auto;height:36px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.v5 .btn.w{background:#fff;color:#0b0f24;border-color:#fff}
.v5 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
</style></head><body>
<div class="page">
 <div class="intro">
  <h1>PersonaLab 워크스페이스 홈 · 트렌디 시안 5종</h1>
  <p>이전 시안과 달리 c10 Greige 제약을 풀고, 요즘 SaaS에서 실제로 쓰는 방향으로 그렸습니다. 필수 요소(검색·상태·최신 회차·상태별 버튼·새 테스트·⋯)는 모두 유지했습니다. 이름과 수치는 예시이고, 일부 화면은 움직입니다.</p>
  <nav><a href="#v1">1 Command</a><a href="#v2">2 Bento</a><a href="#v3">3 Sentence</a><a href="#v4">4 Neo-brutal</a><a href="#v5">5 Aurora Glass</a></nav>
 </div>
 <div id="out" style="display:flex;flex-direction:column;gap:56px"></div>
</div>

 {n:'온보딩 프로토타입',d:'Figma · 모바일',r:1,k:'dr',st:'작성 중',inf:'3단계 대상 사용자에서 멈춤',t:'오늘 09:40',b:'이어서 설정',c:'#e6dcc6'},
 {n:'학원 관리 대시보드',d:'웹 · 데스크톱',r:1,k:'bad',st:'중단',inf:'로그인 화면에서 차단 · 3/6 저장',t:'3일 전',b:'중단 위치 보기',c:'#ecc9c2'},
 {n:'병원 예약 웹',d:'웹 · 모바일',r:2,k:'rd',st:'실행 준비 완료',inf:'6명 구성 · 화면 14개',t:'2일 전',b:'실행 확인',c:'#cde0d2'},

];

function ico(k){var c={run:'#4f7cff',ok:'#3ecf8e',dr:'#8b8b95',bad:'#ff6a5a',rd:'#e8b84a',pt:'#b58cff'}[k];

 return '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="'+c+'" stroke-width="1.6"/><circle cx="8" cy="8" r="2.4" fill="'+c+'"/></svg>'}
var V=[];
