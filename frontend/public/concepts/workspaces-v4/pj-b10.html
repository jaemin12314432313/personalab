<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>PersonaLab · B10 Studio</title><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;800&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./pj.css"><link rel="stylesheet" href="./pj2.css">
<style>
/* B10 · Studio — 왼쪽에 키 큰 올리브 포스터(히어로), 오른쪽에 번호 붙은 프로젝트 목록. 금빛 링. */

:root{--serif:"Noto Serif KR","Nanum Myeongjo",serif;
 --bg:#f5f0e6;--surface:#fffdf8;--surface-2:#f1eadd;--bar-bg:#f5f0e6e8;
 --fg:#1f1a15;--fg-2:#4d443a;--fg-3:#857a6a;--line:#e6dccb;--line-2:#d6c9b2;
 --accent:#1f1a15;--btn-bg:#1f1a15;--btn-fg:#fffdf8;--btn-line:#1f1a15;--btn-hover:#3a3128;
 --c-setup:#857a6a;--c-ready:#b86e0a;--c-run:#2f5fd0;--c-done:#2f7d4f;--danger:#c8452f;--danger-soft:#f9e4de;
 --radius:14px;--radius-sm:9px;--shadow:0 16px 44px #4a3a2a26;--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .13  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.ul{position:relative;display:inline-block;white-space:nowrap}
.ul svg{position:absolute;left:-1%;bottom:-.14em;width:102%;height:.22em;overflow:visible;fill:none;stroke:#d06d5b;stroke-width:2.6;stroke-linecap:round;pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:var(--grain);opacity:.55;mix-blend-mode:multiply;pointer-events:none;z-index:3}
.head h1{font:800 36px/1.4 var(--serif);letter-spacing:-.04em}
.eyebrow{color:var(--fg-3)}
.search,.sort,.ws,.acct>button{background:var(--surface);border-color:var(--line-2)}
.btn.solid{box-shadow:0 6px 16px #1f1a1526}
.dlg{background:var(--surface)}.dlg input{background:var(--surface-2)}
.me{background:var(--surface-2)}
.tabs a[aria-current=page]::after{background:var(--accent)}
.kbd{background:var(--surface-2)}

:root{--h-bg:radial-gradient(420px 300px at 100% 0,#c9b4745a,transparent 70%),radial-gradient(360px 260px at 0 100%,#7a8a4a33,transparent 70%),linear-gradient(165deg,#292d1f,#1b1e14);
 --h-fg:#f4efe0;--h-fg2:#d9d2bc;--h-fg3:#a39d85;--h-line:#ffffff1f;--h-chip:#ffffff12;--h-chip-fg:#e6cf8c;--h-done:#b8e0a0;--h-ready:#ffd28a;--h-setup:#d3ccb6;
 --h-btn-bg:#f4efe0;--h-btn-fg:#1b1e14;--h-btn-hover:#fff;--h-track:#ffffff1a;--h-ring:#dfbd68;--h-ring-glow:#dfbd6877;--h-ev:#ffffff0e;--h-ev-line:#ffffff14;--h-ev-fg:#d9d2bc;--h-ev-b:#fff;
 --h-shadow:0 30px 70px #1b1e1444;--h-spot:.7;--h-radius:30px;--h-title-font:var(--serif);--h-title-weight:800;--h-title:54px;--h-pad:36px 34px}
#rows{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:30px;align-items:start}
.hero-slot{position:sticky;top:84px}
.row.hero{grid-template-columns:1fr;min-height:600px;align-content:space-between;gap:30px}
.row.hero .h-right{flex-direction:column;align-items:stretch;justify-content:flex-start}
.hero .ring{width:176px;height:176px;align-self:flex-start}.hero .ring b{font-size:46px;font-family:var(--serif)}.hero .ring span{bottom:38px}
.hero .stt{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.hero h2{margin-top:22px}
.h-insight i{background:#dfbd68;box-shadow:0 0 0 3px #dfbd6833}
.rest-t{margin-top:6px}
.rest.as-list{counter-reset:r;background:transparent;border:0;border-top:2px solid #1f1a15;border-radius:0;margin-bottom:60px}
.as-list .row{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"name stt more" "last date act";gap:12px 20px;padding:22px 6px;border-bottom:1px solid #d6c9b2;align-items:center}
.as-list .row:hover{background:#efe7d5}
.as-list .p-name::before{counter-increment:r;content:counter(r,decimal-leading-zero);font:500 12px var(--mono);color:#857a6a;width:24px;flex:none;align-self:flex-start;margin-top:8px}
.as-list .p-name b{font:800 20px var(--serif);letter-spacing:-.045em}
.as-list .more{justify-self:end}.as-list .p-date{justify-self:start}.as-list .act{justify-self:end}
.tile{background:color-mix(in srgb,var(--c) 14%,#fffdf8)}
@media(max-width:1000px){#rows{grid-template-columns:1fr}.hero-slot{position:static}.row.hero{min-height:0}}

@media(max-width:1000px){.rest.as-list .row,.rest.as-cards .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name more" "stt stt" "last last" "date date" "act act"}}
</style></head>
<body><div id="app"></div>
<script>window.PL=Object.assign({"layout":"focus","tiles":true,"rest":"list","title":"<span class=\"ul\">프로젝트<svg viewBox=\"0 0 300 18\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path pathLength=\"1\" d=\"M3 11 Q85 1 153 8 T296 6\"/></svg></span>"},{searchHint:'/',newHint:'N',keys:"<span class=\"kbd\">/</span> 검색 · <span class=\"kbd\">N</span> 새 프로젝트"});</script>
<script src="./pj.js"></script>
</body></html>
