<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>PersonaLab · B02 Espresso</title><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;800&display=swap">
<link rel="stylesheet" href="./pj.css"><link rel="stylesheet" href="./pj2.css">
<style>
/* B02 · Espresso — 크림 페이지 위에 진한 에스프레소 히어로. 아래는 점토·세이지·샌드 타일. */

:root{--serif:"Noto Serif KR","Nanum Myeongjo",serif;
 --bg:#f5f0e6;--surface:#fffdf8;--surface-2:#f1eadd;--bar-bg:#f5f0e6e8;
 --fg:#1f1a15;--fg-2:#4d443a;--fg-3:#857a6a;--line:#e6dccb;--line-2:#d6c9b2;
 --accent:#1f1a15;--btn-bg:#1f1a15;--btn-fg:#fffdf8;--btn-line:#1f1a15;--btn-hover:#3a3128;
 --c-setup:#857a6a;--c-ready:#b86e0a;--c-run:#2f5fd0;--c-done:#2f7d4f;--danger:#c8452f;--danger-soft:#f9e4de;
 --radius:14px;--radius-sm:9px;--shadow:0 16px 44px #4a3a2a26;--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .13  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.ul{position:relative;display:inline-block;white-space:nowrap}
.ul svg{position:absolute;left:-1%;bottom:-.14em;width:102%;height:.22em;overflow:visible;fill:none;stroke:#d06d5b;stroke-width:2.6;stroke-linecap:round;pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:var(--grain);opacity:.55;mix-blend-mode:multiply;pointer-events:none;z-index:3}
.head h1{font:800 36px/1.4 var(--serif);letter-spacing:-.04em}
.eyebrow{color:var(--fg-3)}
.search,.sort,.ws,.acct>button{background:var(--surface);border-color:var(--line-2)}
.btn.solid{box-shadow:0 6px 16px #1f1a1526}
.dlg{background:var(--surface)}.dlg input{background:var(--surface-2)}
.me{background:var(--surface-2)}
.tabs a[aria-current=page]::after{background:var(--accent)}
.kbd{background:var(--surface-2)}

:root{--h-bg:radial-gradient(520px 340px at 92% -8%,#d06d5b59,transparent 70%),radial-gradient(380px 260px at 0 110%,#e8a56a2e,transparent 70%),linear-gradient(135deg,#2a1f19,#3b2a21);
 --h-fg:#fbf3e8;--h-fg2:#e6d5c0;--h-fg3:#bfa58c;--h-line:#ffffff22;--h-chip:#ffffff14;--h-chip-fg:#f3b79c;--h-done:#a9e6c0;--h-ready:#ffd28a;--h-setup:#e0cdb6;
 --h-btn-bg:#fbf3e8;--h-btn-fg:#2a1f19;--h-btn-hover:#fff;--h-track:#ffffff1c;--h-ring:#ee9272;--h-ring-glow:#ee927288;--h-ev:#ffffff10;--h-ev-line:#ffffff14;--h-ev-fg:#e6d5c0;--h-ev-b:#fff;
 --h-shadow:0 30px 70px #2a1f1944;--h-spot:.8;--h-title-font:var(--serif);--h-title-weight:800;--h-title:48px;--h-radius:26px}
.as-tiles .row:has(.stt.ready){background:linear-gradient(160deg,#f6dcae,#efc888)}
.as-tiles .row:has(.stt.done):nth-child(odd){background:linear-gradient(160deg,#e2e9cd,#cfdcb2)}
.as-tiles .row:has(.stt.done):nth-child(even){background:linear-gradient(160deg,#f6dccd,#eec3ae)}
.as-tiles .row:has(.stt.setup){background:#fffdf8}
.as-tiles .row{box-shadow:0 1px 2px #4a3a2a14}

</style></head>
<body><div id="app"></div>
<script>window.PL=Object.assign({"layout":"focus","rest":"tiles","title":"<span class=\"ul\">프로젝트<svg viewBox=\"0 0 300 18\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path pathLength=\"1\" d=\"M3 11 Q85 1 153 8 T296 6\"/></svg></span>"},{searchHint:'/',newHint:'N',keys:"<span class=\"kbd\">/</span> 검색 · <span class=\"kbd\">N</span> 새 프로젝트"});</script>
<script src="./pj.js"></script>
</body></html>
