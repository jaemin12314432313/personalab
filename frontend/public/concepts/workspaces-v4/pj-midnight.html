<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex"><title>PersonaLab · Midnight</title><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./pj.css">
<style>
/* A · Midnight — Linear · Raycast 계열. 어두운 바탕, 보라빛 글로우, 마우스를 따라오는 스포트라이트 */
:root{
  --bg:#07070a;--surface:#0e0e13;--surface-2:#15151c;--bar-bg:#07070acc;
  --fg:#f3f3f6;--fg-2:#b6b7c2;--fg-3:#7b7c89;
  --line:#ffffff12;--line-2:#ffffff1f;
  --accent:#8e80ff;--btn-bg:linear-gradient(180deg,#9d90ff,#6a58f2);--btn-fg:#fff;--btn-line:#8e80ff;--btn-hover:linear-gradient(180deg,#a89dff,#7563f5);
  --radius:12px;
  --c-setup:#8c8d99;--c-ready:#f5b544;--c-run:#6ea8ff;--c-done:#4ade80;--danger:#ff6b6b;--danger-soft:#ff6b6b1f;
  --shadow:0 20px 60px #000a;
}
body{background:radial-gradient(900px 420px at 50% -120px,#2a2060 0%,transparent 70%),var(--bg)}
.deco::before{content:"";position:absolute;left:50%;top:-220px;width:900px;height:520px;transform:translateX(-50%);background:radial-gradient(closest-side,#8e80ff55,transparent);filter:blur(30px)}
.deco::after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(60% 70% at 50% 0,#000,transparent);-webkit-mask-image:radial-gradient(60% 70% at 50% 0,#000,transparent)}
.logo{color:#fff}
.btn{background:var(--surface-2);border-color:var(--line-2)}
.btn:hover{border-color:#ffffff40;background:#1c1c26}
.btn.solid{box-shadow:inset 0 1px 0 #ffffff55,0 8px 24px #6a58f255;text-shadow:0 1px 0 #0003}
.btn.solid:hover{box-shadow:inset 0 1px 0 #ffffff66,0 10px 30px #6a58f288}
.search,.sort,.ws,.acct>button{background:#ffffff0a;border-color:var(--line)}
.sort option{background:#15151c}
.tabs a[aria-current=page]::after{background:linear-gradient(90deg,#8e80ff,#6ea8ff);box-shadow:0 0 12px #8e80ffaa}
.ws i{background:linear-gradient(135deg,#9d90ff,#5b8cff)}
.head h1{font-size:44px;font-weight:700;letter-spacing:-.05em;background:linear-gradient(180deg,#fff 30%,#9a9bb0);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{color:#a99fff;font-weight:600;letter-spacing:.01em}
.sum span{padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:#ffffff08;font-size:12.5px}
/* 목록: 한 줄이 카드처럼 떠오르고, 커서 주변이 빛난다 */
.cols{border-bottom-color:var(--line)}
.row{border-bottom:0;margin-top:8px;border:1px solid transparent;border-radius:var(--radius);background:linear-gradient(#0e0e13,#0e0e13) padding-box,linear-gradient(#ffffff0f,#ffffff0f) border-box}
.row::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),#8e80ff26,transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.row::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),#8e80ffcc,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;pointer-events:none}
.row:hover::before,.row:hover::after{opacity:1}
.row:hover{transform:translateY(-1px)}
.row>*{position:relative;z-index:1}
.stt i{box-shadow:0 0 10px currentColor}
.stt.setup i{box-shadow:none}
.stt.run{text-shadow:0 0 14px #6ea8ff66}
.prog{background:#ffffff14}.prog i{background:linear-gradient(90deg,#6ea8ff,#8e80ff);box-shadow:0 0 10px #6ea8ff99}
.act:not(.solid){background:#ffffff0d}
.count{padding-top:18px}
.first h2{background:linear-gradient(180deg,#fff,#9a9bb0);-webkit-background-clip:text;background-clip:text;color:transparent}
.kbd{background:#ffffff0d;border-color:#ffffff22}
.scrim{background:#000b}
.dlg{background:#0e0e13;border-color:#ffffff1f}
.dlg input{background:#ffffff0a}
.toast{background:#f3f3f6;color:#0b0b0f}
</style></head>
<body><div id="app"></div>
<script>window.PL={searchHint:'/',newHint:'N',keys:'<span class="kbd">/</span> 검색 · <span class="kbd">N</span> 새 프로젝트',deco:''};</script>
<script src="./pj.js"></script>
</body></html>
