<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>PersonaLab · Bento</title><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./pj.css">
<style>
/* F · Bento — 크기와 색이 상태를 말한다. 실행 중은 크게, 나머지는 작은 타일 */
:root{
  --bg:#f1eee8;--surface:#fff;--surface-2:#f6f3ed;--bar-bg:#f1eee8d9;
  --fg:#17161a;--fg-2:#4a4850;--fg-3:#7d7a82;
  --line:#e2ddd3;--line-2:#d2ccc0;
  --accent:#17161a;--btn-bg:#17161a;--btn-fg:#fff;--btn-line:#17161a;--btn-hover:#34323a;
  --radius:24px;--radius-sm:12px;
  --c-setup:#6f6b75;--c-ready:#a05a00;--c-run:#fff;--c-done:#0b7a52;--shadow:0 18px 50px #3a2f1a26;
}
.head{padding:50px 0 24px}
.head h1{font-size:34px;letter-spacing:-.05em}
.sum{display:none}
.cols,.count{display:none}
.search,.sort{background:#ffffffb8;border-color:#d9d3c7}
.btn.solid{box-shadow:0 8px 20px #17161a2e}
/* 모자이크 */
body.l-bento #rows{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(222px,auto);grid-auto-flow:dense;gap:14px;padding-bottom:70px}
body.l-bento .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"stt more" "name name" "last last" "date act";gap:10px 10px;align-content:space-between;align-items:center;padding:22px 22px 20px;border:0;border-radius:var(--radius);background:#fff;box-shadow:0 1px 2px #3a2f1a10;overflow:hidden}
body.l-bento .row:hover{transform:translateY(-4px) scale(1.005);box-shadow:0 22px 46px #3a2f1a26}
.p-name{align-self:end;display:block}
.p-name b{font-size:23px;letter-spacing:-.05em;line-height:1.3}
.p-name .pn span{font-size:14px;margin-top:2px}
.stt{padding:4px 11px 4px 9px;border-radius:99px;background:#17161a0d;font-size:12.5px;width:max-content}
.p-last{align-self:start;font-size:14px}
.p-date{font-size:13px}
.act{height:38px;padding:0 16px}
.act:not(.solid){background:#ffffffa6}
/* 상태별 타일 */
.row:has(.stt.setup){background:#fff}
.row:has(.stt.ready){background:linear-gradient(160deg,#ffe9b8,#ffd98a);--fg-3:#7d6a3e;--fg-2:#4d3d17}
.row:has(.stt.ready) .stt{background:#ffffff70;color:#8a4b00}
.row:has(.stt.done):nth-of-type(2n){background:linear-gradient(160deg,#d6f5e5,#bfeed7)}
.row:has(.stt.done):nth-of-type(2n+1){background:linear-gradient(160deg,#e3ddff,#d2c9ff)}
.row:has(.stt.done) .stt{background:#ffffff78}
.row:has(.stt.done){--fg-3:#5d6a62}
.row:has(.stt.done):nth-of-type(2n+1){--fg-3:#6a6490}
/* 실행 중 = 가장 큰 타일 */
.row:has(.stt.run){grid-column:span 2;grid-row:span 2;color:#fff;
  background:radial-gradient(420px 280px at 85% 0,#8b5cf6aa,transparent 70%),radial-gradient(340px 260px at 0 100%,#2563eb88,transparent 70%),linear-gradient(145deg,#1b1646,#29208a);
  --fg:#fff;--fg-2:#e4e3ff;--fg-3:#b8b6ee;--line:#ffffff30;--surface-2:#ffffff14;padding:30px 30px 26px}
.row:has(.stt.run) .p-name b{font-size:44px;letter-spacing:-.06em;line-height:1.15}
.row:has(.stt.run) .p-name .pn span{font-size:16px;margin-top:6px}
.row:has(.stt.run) .stt{background:#ffffff1f;color:#d6d4ff;border:1px solid #ffffff2b}
.row:has(.stt.run) .p-last{font-size:17px;color:#fff}
.row:has(.stt.run) .p-last small{font-size:14px;color:#b8b6ee}
.row:has(.stt.run) .prog{height:8px;background:#ffffff24;margin-top:14px;max-width:none}
.row:has(.stt.run) .prog i{background:linear-gradient(90deg,#8ec5ff,#c4a8ff);box-shadow:0 0 14px #9a9bff99}
.row:has(.stt.run) .act{background:#fff;color:#17161a;border-color:#fff;height:44px;padding:0 22px;font-size:14.5px}
.row:has(.stt.run) .p-date{color:#b8b6ee}
.row:has(.stt.run) .more{color:#cfcdfa}.row:has(.stt.run) .more:hover,.row:has(.stt.run) .more[aria-expanded=true]{background:#ffffff1a;color:#fff}
.row:has(.stt.run)::before{content:"";position:absolute;inset:0;background:radial-gradient(300px circle at var(--mx,60%) var(--my,30%),#ffffff1a,transparent 70%);pointer-events:none}
.row>*{position:relative}
.row .menu{--fg:#17161a;--fg-2:#4a4850;--surface:#fff;--surface-2:#f6f3ed;--line:#e2ddd3;color:#17161a}
/* 새 프로젝트 타일 */
.newtile{border:2px dashed #cdc6b8;background:transparent;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg-3);padding:20px;text-align:center;transition:.25s var(--ease)}
.newtile b{font-size:40px;font-weight:300;line-height:1;color:var(--fg)}
.newtile span{font-weight:650;color:var(--fg);font-size:16px}.newtile small{font-size:13px}
.newtile:hover{background:#ffffff90;border-color:var(--fg);transform:translateY(-3px)}
.none-r{grid-column:1/-1}
.first h2{font-size:36px}
@media(max-width:1000px){body.l-bento #rows{grid-template-columns:repeat(2,minmax(0,1fr))}.row:has(.stt.run){grid-row:span 1}.row:has(.stt.run) .p-name b{font-size:34px}}
@media(max-width:560px){body.l-bento #rows{grid-template-columns:1fr;grid-auto-rows:auto}.row:has(.stt.run){grid-column:span 1}body.l-bento .row{min-height:210px}}
</style></head>
<body><div id="app"></div>
<script>window.PL={layout:'bento',newTile:true,searchHint:'/',newHint:'N',keys:'<span class="kbd">/</span> 검색 · <span class="kbd">N</span> 새 프로젝트'};</script>
<script src="./pj.js"></script>
</body></html>
