<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>PersonaLab · B06 Ticket</title><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;800&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./pj.css"><link rel="stylesheet" href="./pj2.css">
<style>
/* B06 · Ticket — 탑승권처럼. 점선으로 나뉜 스텁에 진행률 링, 아래에 바코드. */

:root{--serif:"Noto Serif KR","Nanum Myeongjo",serif;
 --bg:#f5f0e6;--surface:#fffdf8;--surface-2:#f1eadd;--bar-bg:#f5f0e6e8;
 --fg:#1f1a15;--fg-2:#4d443a;--fg-3:#857a6a;--line:#e6dccb;--line-2:#d6c9b2;
 --accent:#1f1a15;--btn-bg:#1f1a15;--btn-fg:#fffdf8;--btn-line:#1f1a15;--btn-hover:#3a3128;
 --c-setup:#857a6a;--c-ready:#b86e0a;--c-run:#2f5fd0;--c-done:#2f7d4f;--danger:#c8452f;--danger-soft:#f9e4de;
 --radius:14px;--radius-sm:9px;--shadow:0 16px 44px #4a3a2a26;--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .13  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.ul{position:relative;display:inline-block;white-space:nowrap}
.ul svg{position:absolute;left:-1%;bottom:-.14em;width:102%;height:.22em;overflow:visible;fill:none;stroke:#d06d5b;stroke-width:2.6;stroke-linecap:round;pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:var(--grain);opacity:.55;mix-blend-mode:multiply;pointer-events:none;z-index:3}
.head h1{font:800 36px/1.4 var(--serif);letter-spacing:-.04em}
.eyebrow{color:var(--fg-3)}
.search,.sort,.ws,.acct>button{background:var(--surface);border-color:var(--line-2)}
.btn.solid{box-shadow:0 6px 16px #1f1a1526}
.dlg{background:var(--surface)}.dlg input{background:var(--surface-2)}
.me{background:var(--surface-2)}
.tabs a[aria-current=page]::after{background:var(--accent)}
.kbd{background:var(--surface-2)}

:root{--h-bg:#fffdf8;--h-fg:#1f1a15;--h-fg2:#4d443a;--h-fg3:#857a6a;--h-line:#e6dccb;--h-chip:#f5f0e6;--h-chip-fg:#2f5fd0;--h-done:#2f7d4f;--h-ready:#b86e0a;--h-setup:#857a6a;
 --h-btn-bg:#1f1a15;--h-btn-fg:#fffdf8;--h-btn-hover:#3a3128;--h-btn-shadow:0 8px 20px #1f1a1530;--h-track:#eadfce;--h-ring:#d06d5b;--h-ring-glow:transparent;--h-ev:#f8f3e9;--h-ev-line:#eee3d0;--h-ev-fg:#4d443a;--h-ev-b:#1f1a15;
 --h-shadow:0 1px 2px #4a3a2a14,0 24px 50px #4a3a2a1c;--h-spot:0;--h-radius:20px;--h-title-font:var(--serif);--h-title-weight:800;--h-title:46px;--h-pad:34px 36px}
.row.hero{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:0;align-items:stretch;border:1px solid #e6dccb;overflow:hidden}
.row.hero::before{display:none}
.h-left{padding-right:36px}
.h-right{position:relative;flex-direction:column;justify-content:center;gap:16px;padding:6px 0 40px 36px;border-left:2px dashed #cdbd9f;background:repeating-linear-gradient(90deg,#1f1a15 0 2px,transparent 2px 5px,#1f1a15 5px 6px,transparent 6px 9px,#1f1a15 9px 12px,transparent 12px 15px) left bottom/calc(100% - 0px) 22px no-repeat}
.h-right::before,.h-right::after{content:"";position:absolute;left:-15px;width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid #e6dccb}
.h-right::before{top:-48px}.h-right::after{bottom:-48px}
.row.hero .h-right{flex-wrap:nowrap}.row.hero .ev{flex:none;width:100%}
.ring{width:132px;height:132px}.ring b{font-size:34px;font-family:var(--mono);font-weight:500}.ring span{bottom:24px}
.hero .stt,.h-meta,.ev time{font-family:var(--mono);font-size:12px}
.h-insight{background:#fbefe3;border-color:#f0d9c2}
.as-cards .row{border:1.5px dashed #cdbd9f;border-radius:14px;box-shadow:none;background:#fffdf8}
.as-cards .row:hover{box-shadow:0 14px 30px #4a3a2a1a;border-color:#a89572}
.as-cards .p-last{background:#f5efe2}
.stt,.p-date{font-family:var(--mono);font-size:12px}
.tile{background:color-mix(in srgb,var(--c) 14%,#fffdf8)}
@media(max-width:1000px){.row.hero{grid-template-columns:1fr}.h-left{padding-right:0;padding-bottom:26px}.h-right{padding:30px 0 40px;border-left:0;border-top:2px dashed #cdbd9f}.h-right::before{left:-24px;top:-15px}.h-right::after{display:none}}

@media(max-width:1000px){.rest.as-list .row,.rest.as-cards .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name more" "stt stt" "last last" "date date" "act act"}}
</style></head>
<body><div id="app"></div>
<script>window.PL=Object.assign({"layout":"focus","tiles":true,"rest":"cards","title":"<span class=\"ul\">프로젝트<svg viewBox=\"0 0 300 18\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path pathLength=\"1\" d=\"M3 11 Q85 1 153 8 T296 6\"/></svg></span>"},{searchHint:'/',newHint:'N',keys:"<span class=\"kbd\">/</span> 검색 · <span class=\"kbd\">N</span> 새 프로젝트"});</script>
<script src="./pj.js"></script>
</body></html>
