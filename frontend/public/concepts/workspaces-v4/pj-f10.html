<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>PersonaLab · F10 Carousel Aurora</title><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<link rel="stylesheet" href="./pj.css"><link rel="stylesheet" href="./pj2.css">
<style>
/* F10 · Carousel Aurora — 오로라 배경 + 유리 히어로. ←/→ 로 프로젝트를 넘겨 봐요. */
:root{--bg:#fbfbfe;--surface:#fff;--surface-2:#f3f3fa;--bar-bg:#fbfbfecc;--fg:#0b0b1a;--fg-2:#3f3f55;--fg-3:#7a7a92;--line:#e7e7f1;--line-2:#d5d5e4;--accent:#5b4bf5;--btn-bg:#0b0b1a;--btn-hover:#262640;--c-run:#4338ca;--c-done:#0f8a5f;--c-ready:#c2750a;--radius:18px;--radius-sm:10px;
 --h-bg:linear-gradient(135deg,#ffffffc8,#ffffff88);--h-fg:#0b0b1a;--h-fg2:#3f3f55;--h-fg3:#6b6b86;--h-line:#ffffffcc;--h-chip:#ffffffb8;--h-chip-fg:#4338ca;--h-done:#0f8a5f;--h-ready:#a05a00;--h-setup:#5a5a74;
 --h-btn-bg:#0b0b1a;--h-btn-fg:#fff;--h-btn-hover:#262640;--h-btn-shadow:0 10px 24px #0b0b1a33;--h-track:#e1e1f1;--h-ring:#5b4bf5;--h-ring-glow:#5b4bf566;--h-ev:#ffffffb8;--h-ev-line:#ffffff;--h-ev-fg:#3f3f55;--h-ev-b:#0b0b1a;--h-shadow:0 30px 70px #2b1f6a2a,inset 0 0 0 1px #ffffffd0;--h-spot:0;--h-radius:28px;--h-title:48px;--h-pad:40px 44px}
.row.hero{backdrop-filter:blur(18px)}
.deco{height:640px;position:absolute}.deco i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.deco i:nth-child(1){width:520px;height:420px;left:-4%;top:-160px;background:#7c6cff}.deco i:nth-child(2){width:480px;height:380px;left:34%;top:-190px;background:#ff8ab8;animation-delay:-6s}.deco i:nth-child(3){width:460px;height:360px;right:-2%;top:-150px;background:#ffc36b;animation-delay:-11s}.deco i:nth-child(4){width:380px;height:300px;left:58%;top:-110px;background:#6fe3ff;opacity:.4;animation-delay:-3s}
.deco::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--bg) 100%)}
@keyframes drift{to{transform:translate(40px,30px) scale(1.08)}}
.head h1{font-size:44px;font-weight:750;letter-spacing:-.055em}
.search,.sort,.ws,.acct>button{background:#ffffffd0;border-color:#e3e3f1}
.btn.solid{box-shadow:0 8px 22px #0b0b1a33}
.as-cards .row{box-shadow:0 1px 2px #2b1f6a0d,0 10px 30px #2b1f6a0a}
.as-cards .row:hover{border-color:#d8d4f7}
</style></head>
<body><div id="app"></div>
<script>window.PL=Object.assign({"layout":"focus","heroNav":true,"rest":"cards","searchHint":"/","newHint":"N","deco":"<i></i><i></i><i></i><i></i>"},{keys:"<span class=\"kbd\">/</span> 검색 · <span class=\"kbd\">N</span> 새 프로젝트"});</script>
<script src="./pj.js"></script>
</body></html>
