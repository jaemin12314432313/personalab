<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>PersonaLab · D2 문장으로 시작</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="./base.css">
<style>
body{background:var(--warm)}
.stage{min-height:calc(100vh - 60px);display:grid;grid-template-rows:1fr auto;max-width:1040px;margin:0 auto;padding:0 clamp(18px,5vw,48px)}
.hero{align-self:center;padding:72px 0 40px}
.hello{color:var(--ink-3);font-size:15px;margin-bottom:34px;display:flex;gap:10px;align-items:center}
.hello::before{content:"";width:28px;height:1px;background:var(--brown-line)}
.sentence{font-size:clamp(28px,4.6vw,52px);line-height:1.95;font-weight:560;letter-spacing:-.05em;color:var(--ink)}
.sentence .plain{color:var(--ink-3);font-weight:450}
/* 문장 속 빈칸 */
.slot{position:relative;display:inline-block;vertical-align:baseline;margin:0 .06em}
.slot .v{display:inline-block;color:var(--brown);border-bottom:2.5px dashed var(--brown-line);padding:0 .14em 0 .04em;line-height:1.25;transition:background .25s,border-color .25s;border-radius:4px 4px 0 0;white-space:nowrap}
.slot .v::after{content:"▾";font-size:.4em;margin-left:.35em;vertical-align:.25em;opacity:.7}
.slot:hover .v,.slot:focus-within .v{background:#f4e9e2;border-bottom-style:solid;border-color:var(--brown)}
.slot select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.slot.pop .v{animation:pop .5s var(--ease)}
@keyframes pop{0%{background:#ecd5c9}100%{background:transparent}}
.under{display:flex;flex-wrap:wrap;gap:22px 34px;align-items:center;margin-top:46px}
.go{height:56px;padding:0 28px;font-size:17px;border-radius:12px;gap:12px;font-weight:600;box-shadow:0 10px 28px #16161a22}
.go:hover{transform:translateY(-1px)}
.meta{display:flex;gap:26px;flex-wrap:wrap;font-size:14px;color:var(--ink-3)}
.meta b{display:block;color:var(--ink);font-size:20px;font-weight:620;letter-spacing:-.04em;line-height:1.3}
.focus{margin-top:30px;font-size:14px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.focus button{border:1px solid var(--line-2);background:#fff;border-radius:99px;height:30px;padding:0 13px;font-size:13px;color:var(--ink-2);transition:.2s}
.focus button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.focus button:hover{border-color:var(--ink-3)}
.recent{border-top:1px solid var(--line);padding:22px 0 34px;display:grid;grid-template-columns:140px 1fr;gap:16px}
.recent h2{font-size:13px;color:var(--ink-3);font-weight:600;padding-top:9px}
.recent li{display:grid;grid-template-columns:20px 1fr auto auto;gap:14px;align-items:center;padding:9px 0;font-size:15px;border-radius:8px}
.recent li+li{border-top:1px dashed var(--line)}
.recent a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--brown-line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);justify-self:center}
.dot.run{background:var(--blue);animation:blink 1.4s infinite}.dot.done{background:var(--ok)}.dot.draft{background:#fff;border:1.5px solid var(--ink-3)}
@keyframes blink{50%{opacity:.25}}
.recent small{color:var(--ink-3);font-size:13px}
.recent .more{color:var(--ink-3);font-size:13px}
@media(max-width:640px){.recent{grid-template-columns:1fr}.recent li{grid-template-columns:20px 1fr auto}.recent li small:last-child{display:none}.crumb{display:none}.sentence{line-height:2}}
</style></head>
<body>
<header class="bar"><a class="logo" href="./index.html"><i></i>PersonaLab</a><span class="crumb"><b>일정메이트</b> 워크스페이스</span><span class="sp"></span><a class="btn sm quiet" href="#" data-toast="디자인 예시: 모든 테스트 목록은 여기서 열려요">모든 테스트</a><span class="me">나</span></header>

<div class="stage">
  <section class="hero">
    <p class="hello">안녕하세요. 오늘은 어떤 경험이 궁금하세요?</p>
    <h1 class="sentence" aria-live="polite">
      <span class="slot" data-k="flow"><span class="v"></span><select aria-label="살펴볼 화면 흐름"><option value="일정메이트 가입 흐름">일정메이트 가입 흐름</option><option value="일정메이트 홈 화면">일정메이트 홈 화면</option><option value="결제 화면">결제 화면</option><option>새 프로토타입 올리기…</option></select></span><span class="plain">을</span><br>
      <span class="slot" data-k="who"><span class="v"></span><select aria-label="페르소나 조건"><option value="27–34세 직장인">27–34세 직장인</option><option value="20대 대학생">20대 대학생</option><option value="40–50대 부모">40–50대 부모</option><option value="60대 이상">60대 이상</option></select></span>
      <span class="slot" data-k="n"><span class="v"></span><select aria-label="인원"><option value="5">5명</option><option value="20" selected>20명</option><option value="50">50명</option><option value="100">100명</option></select></span><span class="plain">이</span><br>
      <span class="slot" data-k="goal"><span class="v"></span><select aria-label="목표"><option value="회원가입을 마칠 때까지">회원가입을 마칠 때까지</option><option value="첫 일정을 만들 때까지">첫 일정을 만들 때까지</option><option value="자유롭게">자유롭게</option></select></span>
      <span class="plain">살펴보게 하기.</span>
    </h1>

    <div class="focus" id="focus"><span>특히 궁금한 점</span><button aria-pressed="true" data-f="입력 항목">입력 항목 수</button><button aria-pressed="false" data-f="개인정보">개인정보 요구</button><button aria-pressed="false" data-f="문구">문구 이해</button><button aria-pressed="false" data-f="버튼">버튼 찾기</button></div>

    <div class="under">
      <button class="btn solid go" id="go">탐색 시작 <span aria-hidden="true">→</span></button>
      <div class="meta" aria-label="예상">
        <div><b id="mN">20명</b>페르소나</div>
        <div><b id="mT">약 3분</b>예상 시간</div>
        <div><b id="mC">약 $0.5</b>예상 비용</div>
      </div>
    </div>
  </section>

  <section class="recent" aria-label="이어서 하기">
    <h2>이어서 하기</h2>
    <ul>
      <li><span class="dot run"></span><a href="#" data-toast="디자인 예시: 실행 중인 테스트로 이동해요">일정메이트 온보딩 v3</a><small>13 / 20명 탐색 중</small><small>방금</small></li>
      <li><span class="dot done"></span><a href="#" data-toast="디자인 예시: 결과 화면으로 이동해요">일정메이트 온보딩 v2</a><small>3개 발견 · 인터뷰 가능</small><small>어제</small></li>
      <li><span class="dot draft"></span><a href="#" data-toast="디자인 예시: 작성하던 설정으로 돌아가요">결제 화면 점검</a><small>페르소나만 고르면 시작할 수 있어요</small><small>10/30</small></li>
    </ul>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let t;const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(t);t=setTimeout(()=>e.classList.remove('on'),2600)};
function calc(){
  const n=+$('[data-k=n] select').value,f=$$('#focus [aria-pressed=true]').length;
  $('#mN').textContent=n+'명';
  const min=Math.max(1,Math.round(n*.12+f*.3));$('#mT').textContent='약 '+min+'분';
  $('#mC').textContent='약 $'+(n*.025).toFixed(1);
}
function paint(s){const v=s.querySelector('.v'),sel=s.querySelector('select');v.textContent=sel.options[sel.selectedIndex].text}
$$('.slot').forEach(s=>{paint(s);s.querySelector('select').addEventListener('change',()=>{paint(s);s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');calc();
  if(s.querySelector('select').value.includes('새 프로토타입'))toast('디자인 예시: 여기서 피그마 링크 또는 화면 파일을 올려요')})});
$('#focus').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');calc()});
$('#go').addEventListener('click',()=>{const g=k=>$(`[data-k=${k}] .v`).textContent;toast(`디자인 예시: “${g('flow')}을 ${g('who')} ${g('n')}이 ${g('goal')} 살펴보게” 실행돼요`)});
document.addEventListener('click',e=>{const a=e.target.closest('[data-toast]');if(a){e.preventDefault();toast(a.dataset.toast)}});
calc();
</script>
<p class="foot-note" style="max-width:1040px">디자인 비교용 예시입니다. 시간·비용·테스트 상태는 가상이며 실제 계정, 패널, DB, API, LLM과 연결되어 있지 않아요.</p>
</body></html>
