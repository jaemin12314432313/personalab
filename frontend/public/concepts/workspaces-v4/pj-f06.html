<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>PersonaLab · F06 Banner Hero</title><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@800&display=swap">
<link rel="stylesheet" href="./pj.css"><link rel="stylesheet" href="./pj2.css">
<style>
/* F06 · Banner Hero — 랜딩 배너를 히어로로. 진한 그라데이션 가로 배너 + 카드. */

:root{--serif:"Noto Serif KR","Nanum Myeongjo",serif;--bg:#fff;--surface:#fff;--surface-2:#f5f6f8;--bar-bg:#ffffffd9;--fg:#16161a;--fg-2:#44464f;--fg-3:#6a6c76;--line:#e3e4e8;--line-2:#cfd2d8;--accent:#16161a;--btn-bg:#16161a;--btn-hover:#2c2c33;--c-run:#2a63c4;--radius:12px;--radius-sm:8px}
.ul{position:relative;display:inline-block;white-space:nowrap}.ul svg{position:absolute;left:-1%;bottom:-.14em;width:102%;height:.22em;overflow:visible;fill:none;stroke:#d06d5b;stroke-width:2.6;stroke-linecap:round;pointer-events:none}
.head h1{font:800 34px/1.4 var(--serif);letter-spacing:-.04em}
.tabs a[aria-current=page]::after{background:#16161a}
.btn{font-weight:650}
:root{--h-bg:radial-gradient(500px 300px at 100% 0,#e8789a88,transparent 70%),linear-gradient(110deg,#232075,#5a38b0 60%,#b24f9a);--h-title-font:var(--serif);--h-title-weight:800;--h-title:36px;--h-pad:30px 38px;--h-radius:20px;--h-shadow:0 20px 50px #3a2a8a33;--card-hover:0 14px 30px #16161a1c}
.row.hero{grid-template-columns:minmax(0,1.1fr) auto;align-items:center}.hero .ev{display:none}.hero h2{margin:14px 0 4px}.hero .h-meta{margin-top:14px}.hero .h-act{margin-top:20px}.hero .ring{width:136px;height:136px}.hero .ring b{font-size:34px}.hero .ring span{bottom:26px}
@media(max-width:1000px){.row.hero{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div>
<script>window.PL=Object.assign({"layout":"focus","tiles":true,"rest":"cards","title":"<span class=\"ul\">프로젝트<svg viewBox=\"0 0 300 18\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path pathLength=\"1\" d=\"M3 11 Q85 1 153 8 T296 6\"/></svg></span>","searchHint":"/","newHint":"N"},{keys:"<span class=\"kbd\">/</span> 검색 · <span class=\"kbd\">N</span> 새 프로젝트"});</script>
<script src="./pj.js"></script>
</body></html>
