<style>
:root{--bg:#eeebe6;--surface:#fffdf9;--surface-2:#e7e4de;--fg:#1f1a15;--fg-2:#4d443a;--fg-3:#7f7b74;--line:#dedad2;--line-2:#cdc8be;--ink:#17161a;--run:#2f5fd0;--coral:#d06d5b;--green:#2f8f5b;--amber:#b9852f;--red:#c4473a;--serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;--r:16px}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:500 14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}

.mk-wheel{display:flex;gap:.4em;justify-content:center}.mk-wheel i{width:2.2em;height:5em;border-radius:.8em;background:var(--surface-2)}
