<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>세그먼트 · PersonaLab 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@800&display=swap">
<style>
:root{--bg:#eeebe6;--surface:#fffdf9;--surface-2:#e7e4de;--fg:#1f1a15;--fg-2:#4d443a;--fg-3:#7f7b74;--line:#dedad2;--line-2:#cdc8be;--ink:#17161a;--run:#2f5fd0;--coral:#d06d5b;--green:#2f8f5b;--amber:#b9852f;--red:#c4473a;--serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;--r:16px}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:500 14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:20px;height:58px;padding:0 28px;border-bottom:1px solid var(--line);background:#eeebe6d9;backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
.logo{font:800 20px var(--serif);letter-spacing:-.04em}.crumb{color:var(--fg-3);font-size:13px}.crumb b{color:var(--fg);font-weight:700}
.tabs{display:flex;gap:4px;margin-left:auto}.tabs a{padding:8px 14px;border-radius:99px;font-size:13px;font-weight:650;color:var(--fg-2)}.tabs a.on{background:var(--ink);color:#fff}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--fg-2)}
.tag.rule{background:#fff6e8;border-color:#ecd7b2;color:#8a5d10}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 18px;border-radius:99px;border:1px solid var(--line-2);background:#fff;font-weight:650;color:var(--fg)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
.serif{font-family:var(--serif);font-weight:800;letter-spacing:-.04em}
.ul{position:relative;display:inline-block}.ul::after{content:"";position:absolute;left:-1%;right:-1%;bottom:-.08em;height:.14em;background:var(--coral);border-radius:99px;opacity:.9}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.muted{color:var(--fg-3)}.pt{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--surface-2);flex:none}
.pt.lg{width:96px;height:96px}.pt.xl{width:160px;height:160px}.pt.sm{width:30px;height:30px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fg-3)}.dot.run{background:var(--run);box-shadow:0 0 0 4px #2f5fd01f;animation:pulse 1.4s infinite}.dot.done{background:var(--green)}.dot.stop{background:var(--red)}.dot.queue{background:var(--line-2)}
@keyframes pulse{50%{box-shadow:0 0 0 8px #2f5fd000}}
.sev{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:750;color:#fff}
/* 앱 화면 목업 */
.mk{position:relative;width:15em;font-size:12px;background:#fff;border:1px solid var(--line-2);border-radius:1.6em;box-shadow:0 10px 30px #2f251c14;overflow:hidden}
.mk-bar{display:flex;gap:.35em;padding:.8em 1em;border-bottom:1px solid var(--line)}.mk-bar i{width:.6em;height:.6em;border-radius:50%;background:var(--line-2)}
.mk-body{min-height:23em;padding:1.1em;display:flex;flex-direction:column;gap:.8em}
.mk-t{font:800 1.4em var(--serif);letter-spacing:-.03em}.mk-l{display:block;height:.7em;border-radius:99px;background:var(--surface-2)}
.w50{width:50%}.w60{width:60%}.w70{width:70%}.w80{width:80%}
.mk-in{display:block;height:2.4em;border-radius:.8em;border:1px solid var(--line-2);background:#fbfaf7}
.mk-btn{margin-top:auto;display:block;text-align:center;padding:.8em;border-radius:99px;background:var(--ink);color:#fff;font-weight:700}.mk-btn.dim{background:var(--line-2)}
.mk-hero{height:8em;border-radius:1em;background:linear-gradient(120deg,#f6f4f0,#e8e5df)}
.mk-chk{display:flex;gap:.6em;align-items:center}.mk-chk u{width:1.1em;height:1.1em;border:1.5px solid var(--line-2);border-radius:.3em;flex:none}.mk-chk .mk-l{flex:1;width:auto}
.mk-row{display:flex;justify-content:space-between;align-items:center}.mk-dot{width:1.6em;height:1.6em;border-radius:50%;background:var(--surface-2)}
.mk-week,.mk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.3em}.mk-week i{height:.6em;border-radius:99px;background:var(--surface-2)}.mk-grid i{aspect-ratio:1;border-radius:.4em;background:#f6f3ee}
.mk-ev{display:block;height:2.2em;border-radius:.7em;background:#dfe7fb}.mk-ev.s{background:#fbe3dd;width:70%}
.mk-fab{position:absolute;right:1em;bottom:1em;width:2.4em;height:2.4em;border-radius:50%;background:#d9d5cc;color:#fff;display:grid;place-items:center;font-weight:700}
.mk.pin .mk-fab::after{content:"";position:absolute;inset:-.5em;border:2px solid var(--coral);border-radius:50%;animation:pulse2 1.6s infinite}
@keyframes pulse2{50%{transform:scale(1.2);opacity:.4}}
.mk-wheel{display:flex;gap:.4em;justify-content:center}.mk-wheel i{width:2.2em;height:5em;border-radius:.8em;background:var(--surface-2)}
.mk-sw{display:flex;justify-content:space-between;align-items:center;gap:1em}.mk-sw .mk-l{flex:1;width:auto}.mk-sw u{width:2.4em;height:1.3em;border-radius:99px;background:var(--line-2)}
.mk-av{display:flex;gap:.4em}.mk-av i{width:2.4em;height:2.4em;border-radius:50%;background:var(--surface-2)}
.mk-label{position:absolute;left:.8em;bottom:.8em;font-style:normal;font-size:1em;font-weight:700;background:#17161aE6;color:#fff;border-radius:99px;padding:.2em .8em}
.rh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;max-width:1280px;margin:0 auto;padding:30px 28px 20px}.rh h1{margin:0;font-size:32px;line-height:1.35;max-width:760px}.rh p{margin:6px 0 0}.rh-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.wrap{max-width:1280px;margin:0 auto;padding:0 28px 70px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.sgc{padding:26px;display:grid;gap:16px}.sgc h3{margin:0;font:800 22px var(--serif)}.pcts{font:800 56px/1 var(--serif);letter-spacing:-.05em}.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}.ft{display:flex;gap:-8px}.ft .pt{margin-right:-8px;border:2px solid #fff}.top1{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:13px}
</style></head><body><header class="top"><span class="logo">PersonaLab</span><span class="crumb">워크스페이스 / <b>일정메이트</b> · R2</span><nav class="tabs"><a class="" href="#">테스트 설정</a><a class="" href="#">실행</a><a class="on" href="#">리포트</a><a class="" href="#">1대1 인터뷰</a></nav></header><div class="rh"><div><h1 class="serif"><span class="ul">나이대</span>마다 달랐어요</h1><p class="muted">같은 화면을 세 집단이 다르게 겪었어요</p></div><div class="rh-r"><span class="tag rule">규칙 기반 탐색 · 체험용</span><span class="tag">R2 · 30명 · 11월 8일</span><button class="btn">내보내기</button><button class="btn solid">1대1 인터뷰 하기 →</button></div></div><div class="wrap"><div class="sg"><section class="card sgc"><h3>20~30대</h3><div class="pcts">92<small style="font-size:22px">%</small></div><div class="bar"><i style="width:91.66666666666666%"></i></div><div class="muted" style="font-size:13px">12명 중 11명이 끝냈어요</div><div class="ft"><img class="pt sm" src="/personas/portraits/young-male.png" alt="P309 21세 대학생"><img class="pt sm" src="/personas/portraits/adult-female.png" alt="P118 34세 사무직"><img class="pt sm" src="/personas/portraits/young-female.png" alt="P356 29세 프리랜서"><img class="pt sm" src="/personas/portraits/adult-male.png" alt="P072 31세 개발자"></div><div class="top1"><b>가장 큰 걸림돌</b><br>시간 선택 휠이 작아요</div></section><section class="card sgc"><h3>40~50대</h3><div class="pcts">60<small style="font-size:22px">%</small></div><div class="bar"><i style="width:60%"></i></div><div class="muted" style="font-size:13px">10명 중 6명이 끝냈어요</div><div class="ft"><img class="pt sm" src="/personas/portraits/mature-female.png" alt="P227 58세 자영업"><img class="pt sm" src="/personas/portraits/mature-male.png" alt="P190 45세 영업직"><img class="pt sm" src="/personas/portraits/mature-male.png" alt="P133 52세 운전직"></div><div class="top1"><b>가장 큰 걸림돌</b><br>약관 동의 항목이 많아요</div></section><section class="card sgc"><h3>60대 이상</h3><div class="pcts">25<small style="font-size:22px">%</small></div><div class="bar"><i style="width:25%"></i></div><div class="muted" style="font-size:13px">8명 중 2명이 끝냈어요</div><div class="ft"><img class="pt sm" src="/personas/portraits/senior-male.png" alt="P041 67세 은퇴"><img class="pt sm" src="/personas/portraits/senior-female.png" alt="P263 62세 주부"></div><div class="top1"><b>가장 큰 걸림돌</b><br>“푸시 알림”이 낯설어요</div></section></div></div></body></html>
