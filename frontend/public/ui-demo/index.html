<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모아 — 동네 클래스</title><style>body{margin:0;font-family:system-ui,sans-serif;color:#26382c;background:#f7f8f2}header,main{max-width:960px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}a{color:inherit}header strong{font-size:24px;color:#3b6847}nav{display:flex;gap:24px}.hero{padding:70px 0 40px}h1{font-size:clamp(36px,7vw,60px);line-height:1.2;margin:12px 0}p{line-height:1.7;color:#66776a}.button,button{display:inline-block;background:#3b6847;color:white;border:0;border-radius:8px;padding:14px 22px;text-decoration:none;font-size:16px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{padding:24px;background:white;border:1px solid #e2e9df;border-radius:12px}.card h2{font-size:20px}section[hidden]{display:none}input{display:block;padding:12px;margin:10px 0 18px;border:1px solid #c7d2c6;border-radius:6px;font-size:16px}small{color:#708172}</style></head><body><header><strong>moa.</strong><nav><a href="#classes">클래스</a><a href="#signup">가입하기</a></nav></header><main><section id="home"><div class="hero"><small>우리 동네에서 만나는 새로운 취미</small><h1>좋아하는 일을<br>가까운 곳에서.</h1><p>일상에 작은 즐거움을 더할 동네 클래스를 만나보세요.</p><a class="button" href="#classes">클래스 둘러보기</a></div><div class="cards"><article class="card"><h2>천천히 만드는 도자기</h2><p>주말 오후, 나만의 작은 그릇 만들기</p></article><article class="card"><h2>퇴근 후 꽃 한 다발</h2><p>계절의 꽃으로 완성하는 나만의 꽃다발</p></article></div></section><section id="classes" hidden><h1>클래스 둘러보기</h1><div class="cards"><article class="card"><h2>천천히 만드는 도자기</h2><p>토요일 오후 2시 · 38,000원</p><a class="button" href="#signup">신청하기</a></article></div><p><a href="#home">처음으로</a></p></section><section id="signup" hidden><h1>클래스 신청</h1><p>신청을 위해 연락처를 입력해 주세요.</p><form id="form"><label>휴대폰 번호<input type="tel" required placeholder="010-0000-0000"></label><button>신청 완료</button></form><p><a href="#classes">이전으로</a></p></section><section id="done" hidden><h1>신청이 완료됐어요!</h1><p>클래스 정보를 확인해 주세요.</p><a href="#home">처음으로</a></section></main><script>function render(){const id=location.hash.slice(1)||'home';document.querySelectorAll('main > section').forEach(s=>s.hidden=s.id!==id)}addEventListener('hashchange',render);document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();location.hash='done'});render()</script></body></html>
